Section "ServerLayout"
    Identifier "NvidiaDesktop"
    Screen 0 "NvidiaScreen"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "NvidiaGPU"
    Driver "nvidia"
    BusID "PCI:6:16:0"
    Option "AllowEmptyInitialConfiguration" "true"
    # Only synthetic EDID outputs are enabled below. Permit custom window sizes.
    Option "ModeValidation" "AllowNonEdidModes, NoMaxPClkCheck, NoEdidMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck"
    Option "ConnectedMonitor" "DFP-0,DFP-1,DFP-3,DFP-5"
    Option "UseDisplayDevice" "DFP-0,DFP-1,DFP-3,DFP-5"
    Option "CustomEDID" "DFP-0:/etc/X11/spice-virtual-1.edid;DFP-1:/etc/X11/spice-virtual-2.edid;DFP-3:/etc/X11/spice-virtual-3.edid;DFP-5:/etc/X11/spice-virtual-4.edid"
EndSection

Section "Screen"
    Identifier "NvidiaScreen"
    Device "NvidiaGPU"
    DefaultDepth 24
    Option "MetaModes" "DFP-0: 1920x1080 +0+0, DFP-1: NULL, DFP-3: NULL, DFP-5: NULL"
    SubSection "Display"
        Depth 24
        Virtual 3840 2160
    EndSubSection
EndSection
